<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechStore Pro - Verificar Código</title>
  <link rel="stylesheet" href="../output.css">
</head>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans transition-colors duration-500">

  <!-- HEADER -->
  <header class="bg-white/80 dark:bg-gray-900/80 shadow-lg sticky top-0 z-50 transition-colors duration-500 backdrop-blur">
    <nav class="relative max-w-7xl mx-auto px-4 py-4">
      <div class="flex items-center justify-center">
        <div class="flex items-center">
          <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-3 py-2 rounded-lg mr-3">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
              <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" />
            </svg>
          </div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
            <a href="./index.html">TechStore Pro</a>
          </h1>
        </div>
      </div>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="flex items-center justify-center px-4 py-16 min-h-[calc(100vh-200px)]">

    <div class="w-full max-w-md bg-white dark:bg-gray-900 rounded-2xl shadow-2xl p-8 border border-gray-200 dark:border-gray-700">
      
      <div class="text-center mb-6">
        <div class="w-16 h-16 mx-auto flex items-center justify-center bg-gradient-to-r from-blue-600 to-purple-600 rounded-full mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Verifica tu Código</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mt-2">
          Ingresa el código de 6 dígitos que enviamos a<br>
          <strong id="user-email" class="text-blue-600"></strong>
        </p>
      </div>

      <form id="verify-code-form" class="space-y-5">
        
        <!-- Código de 6 dígitos -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2 text-center">
            Código de Verificación
          </label>
          <input 
            id="verification-code" 
            type="text" 
            required
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            class="w-full px-4 py-3 text-center text-2xl tracking-widest font-bold rounded-lg bg-gray-50 dark:bg-gray-800 border-2 border-gray-300 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none text-gray-900 dark:text-gray-100"
            placeholder="000000"
            autocomplete="off">
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-2 text-center">
            Revisa tu correo electrónico
          </p>
        </div>

        <!-- Botón verificar -->
        <button 
          id="verify-btn" 
          type="submit"
          class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold hover:opacity-90 transition">
          Verificar Código
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          ¿No recibiste el código?
        </p>
        <button id="resend-btn" class="text-sm text-blue-600 hover:underline font-semibold mt-2">
          Reenviar código
        </button>
      </div>

      <div class="mt-4 text-center">
        <a href="./recover.html" class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
          ← Volver a solicitar recuperación
        </a>
      </div>
    </div>

  </main>

  <div id="toast-container" class="fixed top-4 right-4 space-y-3 z-[9999]" aria-live="polite"></div>

  <script src="../js/main.js" defer></script>
  <script src="../js/notification.js" defer></script>
  <script src="../js/verificar.js" defer></script>

</body>

</html>
